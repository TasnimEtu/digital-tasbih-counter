<!DOCTYPE html>
<html>
<head>
  <title>Digital Tasbih</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #fff; color: #fff; font-family: sans-serif; text-align: center; }
    #salam { position: fixed; inset: 0; background: #052618; display: grid; place-content: center; gap: 15px; }
    .box { background: #135e3d; border: 2px solid #52b788; padding: 20px; border-radius: 20px; width: 240px; }
    select, input { background: #052618; color: #95d5b2; border: 1px solid #52b788; border-radius: 5px; padding: 4px; margin-top: 8px; }
    progress { width: 100%; margin-top: 8px; }
    #countBox { font-size: 48px; background: #052618; color: #95d5b2; padding: 8px; border-radius: 10px; margin: 10px 0; }
    button { border: none; border-radius: 10px; padding: 9px 14px; font-weight: bold; cursor: pointer; }
    .bigBtn { width: 85px; height: 85px; border-radius: 50%; background: #52b788; color: #052618; font-size: 16px; margin: 10px 0; }
  </style>
</head>
<body>

  <!-- welcome screen -->
  <div id="salam">
    <h1>السَّلَامُ عَلَيْكُمْ</h1>
    <button style="background: #52b788;" onclick="salam.style.display='none'">Start</button>
  </div>

  <!-- main tasbih box -->
  <div class="box">
    <b>DIGITAL TASBIH ☪</b><br>

    <!-- dowa list and add folder button -->
    <select id="dowaList" onchange="showData()"></select>
    <button style="background: #52b788; padding: 4px 8px;" onclick="makeFolder()">+</button><br>

    <!-- target and progress bar -->
    Target: <input id="targetBox" type="number" value="33" style="width: 45px;" onchange="showData()">
    <progress id="bar" value="0" max="33"></progress>

    <!-- numbers -->
    <div id="countBox">0</div>
    <small>Rounds: <b id="roundBox">0</b> | Total: <b id="totalBox">0</b></small><br>

    <!-- buttons -->
    <button class="bigBtn" onclick="plusOne()">COUNT</button><br>
    <button style="background: #2d6a4f; color: #fff;" onclick="minusOne()">-1</button>
    <button style="background: #1b4332; color: #b7e4c7;" onclick="resetNow()">Reset</button>
  </div>

  <script>
    // hide welcome screen after 2 seconds
    setTimeout(function() { salam.style.display = "none"; }, 2000);

    // load saved data or start new
    var db = JSON.parse(localStorage.getItem("myTasbih"));
    if (db == null) {
      db = {
        "Home": { count: 0, rounds: 0, total: 0 },
        "SubhanAllah": { count: 0, rounds: 0, total: 0 },
        "Alhamdulillah": { count: 0, rounds: 0, total: 0 }
      };
    }

    // add dowa names to dropdown
    for (var name in db) {
      dowaList.add(new Option(name, name));
    }

    // make new dowa folder
    function makeFolder() {
      var newName = prompt("Enter new Dowa name:");
      if (newName) {
        db[newName] = { count: 0, rounds: 0, total: 0 };
        dowaList.add(new Option(newName, newName));
        dowaList.value = newName;
        saveData();
      }
    }

    // add 1
    function plusOne() {
      var d = db[dowaList.value];
      d.count = d.count + 1;
      d.total = d.total + 1;

      if (d.count >= targetBox.value) {
        d.rounds = d.rounds + 1;
        d.count = 0;
        alert("Target Completed!");
      }
      saveData();
    }

    // minus 1
    function minusOne() {
      var d = db[dowaList.value];
      if (d.count > 0) {
        d.count = d.count - 1;
        d.total = d.total - 1;
        saveData();
      }
    }

    // reset count and rounds
    function resetNow() {
      var d = db[dowaList.value];
      d.count = 0;
      d.rounds = 0;
      saveData();
    }

    // save and show numbers
    function saveData() {
      localStorage.setItem("myTasbih", JSON.stringify(db));
      showData();
    }

    function showData() {
      var d = db[dowaList.value];
      countBox.innerText = d.count;
      roundBox.innerText = d.rounds;
      totalBox.innerText = d.total;
      bar.max = targetBox.value;
      bar.value = d.count;
    }

    showData();
  </script>

</body>
</html>
