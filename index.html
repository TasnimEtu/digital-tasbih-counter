<!DOCTYPE html>
<html>
<head>
  <title>Digital Tasbih</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #063b27; color: #fff; font-family: sans-serif; text-align: center; }
    #salam { position: fixed; inset: 0; background: #04291a; display: grid; place-content: center; gap: 15px; z-index: 9; }
    .box { background: #0a3a27; border: 2px solid #2ecc71; padding: 25px; border-radius: 20px; width: 250px; }
    #c { font-size: 50px; background: #021d12; color: #2ecc71; padding: 10px; border-radius: 10px; margin: 15px 0; }
    button { border: none; border-radius: 10px; padding: 10px 15px; font-weight: bold; cursor: pointer; }
    .big { width: 90px; height: 90px; border-radius: 50%; background: #2ecc71; font-size: 16px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <!-- শুরুতে শুধু আরবি সালাম -->
  <div id="salam">
    <h1 style="font-size: 40px; color: #a8ff78;">السَّلَامُ عَلَيْكُمْ</h1>
    <button style="background:#2ecc71" onclick="salam.remove()">Start</button>
  </div>

  <!-- তাসবিহ -->
  <div class="box">
    <b>DIGITAL TASBIH</b>
    <div id="c">0</div>
    <button class="big" onclick="c.innerText++">COUNT</button><br>
    <button style="background:#f39c12; color:#fff" onclick="if(c.innerText>0) c.innerText--"> -1 </button>
    <button style="background:#e74c3c; color:#fff" onclick="c.innerText=0"> Reset </button>
  </div>

  <script>
    setTimeout(() => salam.remove(), 2500);
  </script>

</body>
</html>
