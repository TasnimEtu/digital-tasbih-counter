<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Tasbih Counter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #064e3b, #022c22);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app-card {
      background-color: #06281e;
      border: 2px solid #10b981;
      border-radius: 24px;
      padding: 35px 25px;
      width: 310px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    h2 {
      font-size: 20px;
      letter-spacing: 1px;
      color: #a7f3d0;
      margin-bottom: 15px;
    }

    .screen {
      background-color: #021a13;
      border: 1px solid #059669;
      border-radius: 15px;
      padding: 20px 10px;
      margin-bottom: 25px;
    }

    #count {
      font-size: 64px;
      font-weight: bold;
      color: #34d399;
    }

    .btn-count {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(145deg, #10b981, #059669);
      color: #022c22;
      font-size: 22px;
      font-weight: bold;
      border: 4px solid #6ee7b7;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4);
      transition: transform 0.1s;
    }

    .btn-count:active {
      transform: scale(0.94);
    }

    .controls {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-small {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-minus {
      background-color: #f59e0b;
      color: #000;
    }

    .btn-reset {
      background-color: #ef4444;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <h2>DIGITAL TASBIH</h2>
    
    <div class="screen">
      <div id="count">0</div>
    </div>

    <button class="btn-count" onclick="increment()">COUNT</button>

    <div class="controls">
      <button class="btn-small btn-minus" onclick="decrement()">-1</button>
      <button class="btn-small btn-reset" onclick="resetCount()">Reset</button>
    </div>
  </div>

  <script>
    let count = 0;

    function increment() {
      count++;
      document.getElementById("count").innerText = count;
    }

    function decrement() {
      if (count > 0) {
        count--;
        document.getElementById("count").innerText = count;
      }
    }

    function resetCount() {
      count = 0;
      document.getElementById("count").innerText = count;
    }
  </script>

</body>
</html>
