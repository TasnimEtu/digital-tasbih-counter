<!DOCTYPE html>
<html>
<head>
  <title>Digital Tasbih</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #081126; color: #f3d078; font-family: sans-serif; text-align: center; }
    #startScreen { position: fixed; inset: 0; background: #081126; display: grid; place-content: center; gap: 15px; }
    .box { background: #0e1a36; border: 2px solid #d4af37; padding: 20px; border-radius: 20px; width: 250px; }
    select, input { background: #081126; color: #f3d078; border: 1px solid #d4af37; border-radius: 6px; padding: 4px; margin-top: 8px; }
    progress { width: 100%; margin-top: 8px; accent-color: #d4af37; }
    #countBox { font-size: 48px; background: #081126; border: 1px solid #d4af37; padding: 8px; border-radius: 12px; margin: 10px 0; }
    button { border: none; border-radius: 10px; padding: 8px 14px; font-weight: bold; cursor: pointer; background: #d4af37; color: #081126; }
  </style>
</head>
<body>

  <!-- Bismillah Screen -->
  <div id="startScreen">
    <h1>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</h1>
    <button onclick="startScreen.style.display='none'">Start</button>
  </div>

  <!-- Main Tasbih Box -->
  <div class="box">
    <b>DIGITAL TASBIH ☪</b><br>

    <select id="dowaList" onchange="showData()"></select>
    <button onclick="addDowa()">+</button>
    <button onclick="delDowa()">-</button><br>

    <h3 id="arbiView" style="margin: 10px 0;">سُبْحَانَ اللَّهِ</h3>

    Target: <input id="targetBox" type="number" min="1" value="33" style="width: 45px;" onchange="setTarget()">
    <progress id="bar" value="0" max="33"></progress>

    <div id="msg" style="height: 18px; font-size: 13px;"></div>
    <div id="countBox">0</div>
    <small>Rounds: <b id="roundBox">0</b> | Total: <b id="totalBox">0</b></small><br><br>

    <button style="width: 100%; padding: 14px; font-size: 16px;" onclick="addCount()">TAP TO COUNT</button><br><br>
    <button onclick="minusCount()">-1</button>
    <button onclick="resetCount()">Reset</button>
  </div>

  <script>
    setTimeout(function() { startScreen.style.display = "none"; }, 2500);

    var db = JSON.parse(localStorage.getItem("myTasbihSimple"));
    if (db == null) {
      db = {
        "SubhanAllah": { ar: "سُبْحَانَ اللَّهِ", count: 0, rounds: 0, total: 0, target: 33 },
        "Alhamdulillah": { ar: "الْحَمْدُ لِلَّهِ", count: 0, rounds: 0, total: 0, target: 33 },
        "Allahu Akbar": { ar: "اللَّهُ أَكْبَرُ", count: 0, rounds: 0, total: 0, target: 34 }
      };
    }

    for (var name in db) { dowaList.add(new Option(name, name)); }

    var audio = new AudioContext();
    function tikSound() {
      var beep = audio.createOscillator();
      beep.frequency.value = 1200;
      beep.connect(audio.destination);
      beep.start();
      beep.stop(audio.currentTime + 0.015);
    }

    function addDowa() {
      var name = prompt("Enter Dowa Name:");
      if (name) {
        var arbi = prompt("Enter Arabic (Optional):") || name;
        db[name] = { ar: arbi, count: 0, rounds: 0, total: 0, target: 33 };
        dowaList.add(new Option(name, name));
        dowaList.value = name;
        save();
      }
    }

    function delDowa() {
      if (dowaList.value == "SubhanAllah") { msg.innerText = "Cannot delete!"; return; }
      delete db[dowaList.value];
      dowaList.remove(dowaList.selectedIndex);
      save();
    }

    function setTarget() {
      var val = parseInt(targetBox.value);
      if (val < 1 || isNaN(val)) { val = 1; }
      db[dowaList.value].target = val;
      save();
    }

    function addCount() {
      tikSound();
      msg.innerText = "";
      var d = db[dowaList.value];
      d.count = d.count + 1;
      d.total = d.total + 1;
      if (d.count >= d.target) { d.rounds = d.rounds + 1; d.count = 0; msg.innerText = "Completed!"; }
      save();
    }

    function minusCount() {
      var d = db[dowaList.value];
      if (d.count > 0) { d.count = d.count - 1; d.total = d.total - 1; save(); }
    }

    function resetCount() {
      var d = db[dowaList.value];
      d.count = 0; d.rounds = 0; msg.innerText = "Reset!"; save();
    }

    function save() { localStorage.setItem("myTasbihSimple", JSON.stringify(db)); showData(); }

    function showData() {
      var d = db[dowaList.value];
      arbiView.innerText = d.ar;
      countBox.innerText = d.count;
      roundBox.innerText = d.rounds;
      totalBox.innerText = d.total;
      targetBox.value = d.target;
      bar.max = d.target;
      bar.value = d.count;
    }
    showData();
  </script>
</body>
</html>
