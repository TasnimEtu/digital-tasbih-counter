<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Tasbih</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      width: 340px;
      text-align: center;
    }
    select, input {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      margin: 5px 0;
    }
    .zikr-display {
      font-size: 24px;
      font-weight: bold;
      color: #0f766e;
      margin: 10px 0 5px;
    }
    /* Visual Progress Bar (Feature 3) */
    .progress-bg {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #10b981;
      transition: width 0.2s;
    }
    .count-box {
      font-size: 56px;
      font-weight: bold;
      color: #1e293b;
      margin: 10px 0;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      background: #f8fafc;
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      color: #475569;
      margin-bottom: 15px;
    }
    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.1s;
    }
    button:active { transform: scale(0.96); }
    .btn-count {
      width: 100%;
      padding: 18px;
      font-size: 20px;
      background: #0f766e;
      color: white;
      margin-bottom: 10px;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    .controls button {
      flex: 1;
      padding: 10px;
      background: #e2e8f0;
      color: #334155;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Feature 2: Zikr Presets -->
  <select id="zikrSelect" onchange="changeZikr()">
    <option value="سُبْحَانَ اللَّهِ (SubhanAllah)">SubhanAllah (সুবহানাল্লাহ)</option>
    <option value="الْحَمْدُ لِلَّهِ (Alhamdulillah)">Alhamdulillah (আলহামদুলিল্লাহ)</option>
    <option value="اللَّهُ أَكْبَرُ (Allahu Akbar)">Allahu Akbar (আল্লাহু আকবার)</option>
    <option value="أَسْتَغْفِرُ اللَّهَ (Astaghfirullah)">Astaghfirullah (আস্তাগফিরুল্লাহ)</option>
  </select>

  <div>
    Target: <input type="number" id="targetInput" value="33" min="1" style="width: 65px;" onchange="updateUI()">
  </div>

  <div class="zikr-display" id="zikrText">سُبْحَانَ اللَّهِ (SubhanAllah)</div>

  <!-- Feature 3: Visual Progress -->
  <div class="progress-bg"><div class="progress-fill" id="progressBar"></div></div>

  <!-- Feature 1: Main Count -->
  <div class="count-box" id="countDisplay">0</div>

  <!-- Feature 1 & 5: Rounds, Today & Total Stats -->
  <div class="stats">
    <span>Rounds: <b id="roundDisplay">0</b></span>
    <span>Today: <b id="todayDisplay">0</b></span>
    <span>Total: <b id="totalDisplay">0</b></span>
  </div>

  <button class="btn-count" onclick="increment()">COUNT (+1)</button>

  <div class="controls">
    <button onclick="decrement()">-1</button>
    <button onclick="resetCurrent()">Reset</button>
    <button id="soundBtn" onclick="toggleSound()">Sound: ON</button>
  </div>
</div>

<script>
  // Feature 1 & 5: Load saved data from localStorage (Auto-Save)
  const todayDate = new Date().toLocaleDateString();
  let data = JSON.parse(localStorage.getItem('tasbihData')) || {
    count: 0, rounds: 0, total: 0, today: 0, date: todayDate, sound: true
  };

  // Reset today's count if it's a new day
  if (data.date !== todayDate) {
    data.today = 0;
    data.date = todayDate;
  }

  // Feature 3: Built-in Sound Generator (No external mp3 needed)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq, duration) {
    if (!data.sound) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  }

  // Main Increment Logic
  function increment() {
    const target = parseInt(document.getElementById('targetInput').value) || 33;
    data.count++;
    data.today++;
    data.total++;

    if (data.count >= target) {
      data.rounds++;
      data.count = 0; // Reset for next round
      playBeep(880, 0.3); // High bell sound on target complete
    } else {
      playBeep(400, 0.06); // Soft click sound
    }
    saveAndUpdate();
  }

  // Undo / Minus 1 (-1)
  function decrement() {
    if (data.count > 0) {
      data.count--;
      data.today = Math.max(0, data.today - 1);
      data.total = Math.max(0, data.total - 1);
      saveAndUpdate();
    }
  }

  function resetCurrent() {
    data.count = 0;
    data.rounds = 0;
    saveAndUpdate();
  }

  function changeZikr() {
    document.getElementById('zikrText').innerText = document.getElementById('zikrSelect').value;
    resetCurrent();
  }

  function toggleSound() {
    data.sound = !data.sound;
    saveAndUpdate();
  }

  function saveAndUpdate() {
    localStorage.setItem('tasbihData', JSON.stringify(data));
    updateUI();
  }

  function updateUI() {
    const target = parseInt(document.getElementById('targetInput').value) || 33;
    document.getElementById('countDisplay').innerText = data.count;
    document.getElementById('roundDisplay').innerText = data.rounds;
    document.getElementById('todayDisplay').innerText = data.today;
    document.getElementById('totalDisplay').innerText = data.total;
    document.getElementById('soundBtn').innerText = data.sound ? "Sound: ON" : "Sound: OFF";
    
    // Update progress bar width
    const percent = Math.min(100, (data.count / target) * 100);
    document.getElementById('progressBar').style.width = percent + "%";
  }

  updateUI(); // Initialize UI on load
</script>

</body>
</html>
