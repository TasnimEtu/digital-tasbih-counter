<!DOCTYPE html>
<html>
<head>
  <title>Digital Tasbih</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #0a3d27;
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .bg span {
      position: fixed;
      color: rgba(255, 255, 255, 0.25);
      pointer-events: none;
    }

    #salam {
      position: fixed;
      inset: 0;
      background: #052618;
      display: grid;
      place-content: center;
      gap: 15px;
      z-index: 9;
    }

    .box {
      background: #135e3d;
      border: 2px solid #52b788;
      padding: 25px;
      border-radius: 20px;
      width: 240px;
      z-index: 1;
    }

    #c {
      font-size: 50px;
      background: #052618;
      color: #95d5b2;
      padding: 10px;
      border-radius: 10px;
      margin: 15px 0;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .big { width: 90px; height: 90px; border-radius: 50%; background: #52b788; color: #052618; font-size: 16px; margin-bottom: 15px; }
    .minus { background: #2d6a4f; color: #fff; }
    .reset { background: #1b4332; color: #b7e4c7; }
  </style>
</head>
<body>

  <div class="bg">
    <span style="top:8%; left:12%; font-size:55px;">☪</span>
    <span style="top:12%; right:15%; font-size:35px;">✦</span>
    <span style="top:25%; left:30%; font-size:20px;">★</span>
    <span style="top:18%; right:35%; font-size:45px;">☽</span>
    <span style="bottom:15%; left:15%; font-size:40px;">✦</span>
    <span style="bottom:20%; right:12%; font-size:60px;">☪</span>
    <span style="bottom:30%; left:28%; font-size:22px;">✧</span>
    <span style="top:50%; left:8%; font-size:30px;">★</span>
    <span style="top:55%; right:10%; font-size:25px;">✦</span>
    <span style="bottom:10%; right:40%; font-size:28px;">★</span>
  </div>

  <div id="salam">
    <h1 style="font-size: 40px;">السَّلَامُ عَلَيْكُمْ</h1>
    <button style="background: #52b788;" onclick="salam.remove()">Start</button>
  </div>

  <div class="box">
    <b>DIGITAL TASBIH</b>
    <div id="c">0</div>
    <button class="big" onclick="c.innerText++">COUNT</button><br>
    <button class="minus" onclick="if(c.innerText>0) c.innerText--"> -1 </button>
    <button class="reset" onclick="c.innerText=0"> Reset </button>
  </div>

  <script>
    setTimeout(() => salam.remove(), 2500);
  </script>

</body>
</html>
